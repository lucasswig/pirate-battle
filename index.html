        border: 1.5px solid rgba(255, 255, 255, 0.2);

        <div style="display:flex;align-items:center;gap:10px;">
          <div class="initial-loader-spinner"></div>
          <span style="font-family:system-ui,-apple-system,sans-serif;font-size:11px;font-weight:600;letter-spacing:0.2em;color:rgba(255,255,255,0.9);text-transform:uppercase;">
